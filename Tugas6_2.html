<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            color: blue;
        }
        .warna {
            color: green;
        }
        .aligment {
            text-align: right;
        }
        .decoration {
            text-decoration: underline;
        }
        .shadow {
            text-shadow: 2px 2px 5px red;
        }
        .transform {
            text-transform: uppercase;
        }
        

    </style>
    <h1 class="warna">Ini text color</h1>
    <p class="aligment" >Ini text aligment</p>
    <p class="decoration" >Ini text decoration</p>
    <p class="shadow">Ini text shadow</p>
    <p class="transform">Ini text transform</p>
</body>
</html>
