<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulir Pendaftarn Siswwa</h1>
    <form>
    <table border="1">
        <tr>
            <td><label for="Nama">Nama Calon Siswa</label></td>
            <td>:</td>
            <td><input id="Nama" type="text" placeholder="Tuliskan Nama Lengkapmu"></td
        </tr>
        <tr>
            <td><label for="Tempat">Tempat/Tanggal Lahir</label></td>
            <td>:</td>
            <td><input type="text" placeholder="Tuliskan Tempat Lahirmu" id="Tempat">
            <input type="date" ></td>
        </tr>
        <tr>
            <td><label >Agama</label></td>
            <td>:</td>
            <td>
                <select>
                    <option value="Islam">Islam</option>
                    <option value="Kristen">Kristen</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Budha">Budha</option>
                    <option value="Konghucu">Konghucu</option>
                </select>
        </tr>
        <tr>
            <td><label for="Alaamat">Alamat</label></td>
            <td>:</td>
            <td><textarea id="Alamat" cols="45" rows="4"></textarea></td>
        </tr>
        <tr>
            <td><label for="No_Telp">No.Telp/Hp</label></td>
            <td>:</td>
            <td><input id="No_Telp" type="number" ></td>
        </tr>
        <tr>
            <td><label for="JK">Jenis Kelamin</label></td>
        
            <td>:</td>
            <td>
                <input type="radio" value="Laki-Laki" name="JK">Laki-Laki
                <input type="radio" value="Perempuan" name="JK">Perempuan
        </tr>
        <tr>
            <td><labek>Hobi</labek></td>
            <td>:</td>
            <td>
                <input type="checkbox" value="Membaca" name="Hobi">Membaca
                <input type="checkbox" value="Menulis" name="Hobi">Menulis
                                <input type="checkbox" value="Olahraga" name="Hobi">Olahraga
        </tr>
        <tr>
            <td><label>Pas Foto</label></td>
            <td>:</td>
            <td><input type="file" ></td>
        </tr>
        <tr>
            <td>Username</td>
            <td>:</td>
            <td><input type="text" placeholder="Buat Username"></td>
        </tr>
        <tr>
            <td>Password</td>
            <td>:</td>
            <td><input type="password" placeholder="Buat Password"></td>
        </tr>
        <tr align="Right">
            <td colspan="45"><input type="submit" value="Submit">
            <input type="reset" value="Reset"></td>
    </table>
    </form>
</body>
</html>
